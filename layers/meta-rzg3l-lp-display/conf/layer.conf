# RZ/G3L LowPower Display: the display stays on in system suspend (DISP_RET),
# driven by the CM33 from SRAM

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rzg3l-lp-display"
BBFILE_PATTERN_meta-rzg3l-lp-display = "^${LAYERDIR}/"

# Apply after meta-rz-multi-os and meta-rzg3l-seamless-logo-still (priority 20).
BBFILE_PRIORITY_meta-rzg3l-lp-display = "30"

# rz-multi-os:          BL2 loads and starts the CM33 firmware (RZ_CM33_FIRMWARE_LOAD),
#                       BL22 at SRAM 0x20000-0x59FFF, BL2 at 0x5C000
# meta-rzg3l-seamless-logo-still: seamless takeover of the running display pipeline (Step 2/3)
# arm-toolchain:        gcc-arm-none-eabi-native for the CM33 firmware
LAYERDEPENDS_meta-rzg3l-lp-display = "core meta-rz-bsp rz-multi-os meta-rzg3l-seamless-logo-still arm-toolchain"

LAYERSERIES_COMPAT_meta-rzg3l-lp-display = "scarthgap"

# BL2 loads and starts the CM33 firmware (meta-rz-multi-os, disabled by default there)
MACHINE_FEATURES:append = " RZ_CM33_FIRMWARE_LOAD"
