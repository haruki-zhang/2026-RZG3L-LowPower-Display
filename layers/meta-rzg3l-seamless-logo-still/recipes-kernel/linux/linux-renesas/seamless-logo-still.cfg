# The display drivers skip their reset for the first modeset only. The first
# DRM commit therefore replaces the logo, so it must come from the compositor.
#
# The framebuffer console commits a black frame from the DU probe. That
# erases the logo and uses up the hand-over before Weston starts. Without
# fbdev emulation there is no console commit, and no framebuffer held in CMA.
# Weston does not use /dev/fb0.
#
# If something needs /dev/fb0, re-enable fbdev emulation only. The console is
# the part that commits.
#
# Do not name a symbol set below in these comments. merge_config.sh greps the
# whole file and reports a false "value is redefined".

# CONFIG_DRM_FBDEV_EMULATION is not set
# CONFIG_FRAMEBUFFER_CONSOLE is not set
# CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY is not set

# The console would draw the kernel logo over the U-Boot logo.
# CONFIG_LOGO is not set
# CONFIG_LOGO_LINUX_CLUT224 is not set
