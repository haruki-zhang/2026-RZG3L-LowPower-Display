BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rzg3l-seamless-logo-still"
BBFILE_PATTERN_meta-rzg3l-seamless-logo-still = "^${LAYERDIR}/"

# Higher than the Renesas layers, so these bbappends apply last.
BBFILE_PRIORITY_meta-rzg3l-seamless-logo-still = "20"

LAYERDEPENDS_meta-rzg3l-seamless-logo-still = "core meta-rz-bsp"
LAYERSERIES_COMPAT_meta-rzg3l-seamless-logo-still = "scarthgap"

# U-Boot loads the logo from /boot on the rootfs. Set here, so that adding the
# layer is enough. This applies to every image.
#
# Set RZG3L_STILL_LOGO_PACKAGE = "" for an image without the logo, for example
# a recovery image. U-Boot then shows a black frame, and the hand-over to the
# kernel still works.
RZG3L_STILL_LOGO_PACKAGE ?= "rzg3l-seamless-logo-still-image"
IMAGE_INSTALL:append = " ${RZG3L_STILL_LOGO_PACKAGE}"
